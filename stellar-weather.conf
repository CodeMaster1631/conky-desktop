conky.config = {
    own_window = true,
    own_window_class = 'StellarWeather',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = false,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    use_xft = true,

    update_interval = 1800,

    alignment = 'top_left',
    gap_x = 0,
    gap_y = 500,

    minimum_width = 500,
    maximum_width = 500,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    default_color = '#d8d8d8',
};

conky.text = [[
${alignc}${font CodeNewRoman Nerd Font Mono:size=18}${color #d8d8d8}${execi 1800 curl -s 'https://wttr.in/Ahmedabad?format=%t' | tr -d '\n'}${font}
${voffset 3}
${alignc}${font CodeNewRoman Nerd Font Mono:size=11}${color #a8a8a8}${execi 1800 curl -s 'https://wttr.in/Ahmedabad?format=%C' | tr -d '\n'}${font}
]];


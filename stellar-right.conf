conky.config = {
    alignment = 'top_right',

    background = false,
    border_width = 0,

    double_buffer = true,

    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    xftalpha = 1.0,

    font = 'JetBrains Mono Nerd Font:size=10',

    gap_x = -5000,
    gap_y = -5000,

    own_window = true,
    own_window_class = 'StellarRight',
    own_window_type = 'desktop',

    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    update_interval = 1,

    minimum_width = 0,
    minimum_height = 0,

    use_spacer = 'none',
};

conky.text = [[
${color #e6a65d}${execi 60 date '+%a %d'}${color}
${voffset 0.5}
${color #82b8d9}${execi 60 date -d '+1 day' '+%a %d'}${color}
${voffset 0.5}
${color #d6b36a}${execi 60 date -d '+2 days' '+%a %d'}${color}
${voffset 0.5}
${color #b89bd4}${execi 60 date -d '+3 days' '+%a %d'}${color}
${voffset 0.5}
${color #72c4b0}${execi 60 date -d '+4 days' '+%a %d'}${color}
${voffset 0.5}
${color #d987a8}${execi 60 date -d '+5 days' '+%a %d'}${color}
${voffset 0.5}
${color #8fa9e0}${execi 60 date -d '+6 days' '+%a %d'}${color}

${voffset 8}

${font JetBrains Mono Nerd Font:size=40}${color #e5e5e5}${time %d}${font}
${voffset 2}
${font JetBrains Mono Nerd Font:size=13}${color #82b8d9}${time %A}${font}
${voffset 1}
${font JetBrains Mono Nerd Font:size=13}${color #d6b36a}${time %B}${font}

${voffset 8}

${color #8fa9e0}${execi 60 date -d '+7 days' '+%a %d'}${color}
${voffset 0.5}
${color #c58b72}${execi 60 date -d '+8 days' '+%a %d'}${color}
${voffset 0.5}
${color #72c4b0}${execi 60 date -d '+9 days' '+%a %d'}${color}
]]

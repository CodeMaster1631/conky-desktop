conky.config = {
    own_window = true,
    own_window_class = 'StellarAhmedabad',
    own_window_type = 'desktop',

    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    use_xft = true,
    override_utf8_locale = true,

    font = 'JetBrainsMono Nerd Font:size=10',

    update_interval = 1,

    alignment = 'top_left',
    gap_x = -5000,
    gap_y = -5000,

    minimum_width = 300,
    maximum_width = 300,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    default_color = '#d8d8d8',
};

conky.text = [[
${alignc}${font JetBrainsMono Nerd Font:size=10}${color #b8a9d9}AHMEDABAD${font}
${voffset 0.1}
${alignc}${font JetBrainsMono Nerd Font:size=24}${color #f2c6a0}${time %H:%M}${font}

${voffset 0.2}
${alignc}${font JetBrainsMono Nerd Font:size=12}${color #8fd3e8}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | head -1 | cut -d'|' -f1}${font}${voffset -3}  ${font DejaVu Sans:size=12}${color #f4d06f}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | head -1 | cut -d'|' -f2}${font}${voffset -1}  ${font JetBrainsMono Nerd Font:size=12}${color #b8a9d9}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | head -1 | cut -d'|' -f3}${font}

${voffset 0.2}
${alignc}${font JetBrainsMono Nerd Font:size=9}${color #8fa8c7}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '2p' | cut -d'|' -f1}    ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '3p' | cut -d'|' -f1}    ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '4p' | cut -d'|' -f1}${font}

${alignc}${font DejaVu Sans:size=15}${color #f4d06f}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '2p' | cut -d'|' -f3}       ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '3p' | cut -d'|' -f3}       ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '4p' | cut -d'|' -f3}${font}

${alignc}${font JetBrainsMono Nerd Font:size=9}${color #8fd3e8}${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '2p' | cut -d'|' -f2}       ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '3p' | cut -d'|' -f2}       ${execi 1800 ~/.config/conky/weather/weather.py ahmedabad | sed -n '4p' | cut -d'|' -f2}${font}
]];
